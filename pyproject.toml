[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "covid-xray"
version = "0.1.0"
description = "COVID-19 chest X-ray classification using a custom CNN"
requires-python = ">=3.10,<3.13"
dependencies = [
    "tensorflow>=2.16,<2.18",
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "opencv-python-headless>=4.9,<4.12",
    "pillow>=10,<12",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<0.14",
    "scikit-learn>=1.4,<1.7",
    "streamlit==1.45.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]